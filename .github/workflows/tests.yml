name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Run mypy
        run: |
          python -m mypy calculator

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=calculator --cov-report=term-missing --cov-fail-under=50
          